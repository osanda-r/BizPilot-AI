name: Checks
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: ruff check backend
      - run: ruff format --check backend
      - run: python -m pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - run: npx playwright install --with-deps chromium
      - name: Browser workflows and accessibility
        run: |
          python -m venv ../.venv
          ../.venv/bin/python -m pip install -r ../backend/requirements.txt
          (cd ../backend && ../.venv/bin/python -m uvicorn app.main:app --host 127.0.0.1 --port 8000) &
          npm run dev &
          node --input-type=module -e 'for(let i=0;i<60;i++){try{const r=await fetch("http://127.0.0.1:5173/health");if(r.ok)process.exit(0)}catch{};await new Promise(r=>setTimeout(r,1000))}process.exit(1)'
          npm run test:browser
